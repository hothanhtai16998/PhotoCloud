<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#FAF8F4" />
    <script id="site-theme-init">
      (() => {
        let dark = false;
        try { dark = localStorage.getItem('theme') === 'dark'; } catch {}
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.classList.toggle('dark-theme', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        // Public first paint must use the same surface as the eventual app.
        // Keep the admin startup path and palette runtime unchanged.
        if (/^\/admin(?:\/|$)/.test(location.pathname)) return;
        document.documentElement.dataset.publicStartup = '1';
        try {
          document.documentElement.dataset.publicLocale = localStorage.getItem('app_locale') === 'en' ? 'en' : 'vi';
          document.documentElement.dataset.publicAuth = sessionStorage.getItem('headerAuthHint') === 'guest' ? 'guest' : 'pending';
        } catch {}
        const defaults = /* public-palette-defaults */ {};
        let cached;
        try { cached = JSON.parse(localStorage.getItem('photocloud.sitePalette.v1')); } catch {}
        const style = document.createElement('style');
        style.id = 'site-palette';
        style.textContent = ['light', 'dark'].map(theme => {
          const colors = Object.entries(defaults[theme]).map(([key, fallback]) => {
            const color = cached?.[theme]?.[key];
            return `${key}:${typeof color === 'string' && /^#[a-f\d]{6}$/i.test(color) ? color : fallback}`;
          }).join(';');
          const selector = theme === 'dark' ? 'html[data-site-palette].dark-theme' : 'html[data-site-palette]:not(.dark-theme)';
          return `${selector}{${colors}}${selector} body{${colors}}`;
        }).join('\n');
        document.head.append(style);
        document.documentElement.dataset.sitePalette = '1';
        const themeColor = cached?.[dark ? 'dark' : 'light']?.['--bg-primary'];
        document.querySelector('meta[name="theme-color"]').content =
          typeof themeColor === 'string' && /^#[a-f\d]{6}$/i.test(themeColor)
            ? themeColor : defaults[dark ? 'dark' : 'light']['--bg-primary'];
        if (/^\/collections(?:\/|$)/.test(location.pathname)) {
          document.documentElement.dataset.startupSurface = location.pathname.replace(/\/$/, '') === '/collections' ? 'collections-list' : 'collections-detail';
        }
      })();
    </script>
    <!-- public-header-critical -->
    <script id="reload-scroll-reset">
      (() => {
        if (performance.getEntriesByType('navigation')[0]?.type !== 'reload') return;
        const previousRestoration = history.scrollRestoration;
        history.scrollRestoration = 'manual';
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
        window.addEventListener('pageshow', () => {
          requestAnimationFrame(() => {
            window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
            history.scrollRestoration = previousRestoration;
          });
        }, { once: true });
      })();
    </script>

    <style>
      /* CRITICAL: Hide scrollbar IMMEDIATELY on page load to prevent flash */
      /* Must be in <head> and load BEFORE any other CSS */
      /* This prevents scrollbar from appearing during page refresh */
      html[data-public-startup] {
        background-color: var(--bg-primary, #FAF8F4);
      }
      html {
        overflow-y: auto !important;
        overflow-x: hidden !important;
        scrollbar-gutter: stable !important;
        scrollbar-width: none !important; /* Firefox */
        -ms-overflow-style: none !important; /* IE and Edge */
      }
      html::-webkit-scrollbar {
        display: none !important; /* Chrome, Safari, Opera */
        width: 0 !important;
        height: 0 !important;
      }
      body {
        overflow-y: visible !important;
        overflow-x: hidden !important;
      }
      /* Hide scrollbars on all elements to prevent any flash */
      * {
        scrollbar-width: none !important; /* Firefox */
        -ms-overflow-style: none !important; /* IE and Edge */
      }
      *::-webkit-scrollbar {
        display: none !important; /* Chrome, Safari, Opera */
        width: 0 !important;
        height: 0 !important;
      }
      
      /* Branded startup state, available before the app bundle loads. */
      #root:empty::before {
        content: '';
        width: 64px;
        height: 64px;
        background: var(--text-primary, #1B1B19);
        /* Lucide Camera, available before React loads. */
        mask: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.4%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M13.997%204a2%202%200%200%201%201.76%201.05l.486.9A2%202%200%200%200%2018.003%207H20a2%202%200%200%201%202%202v9a2%202%200%200%201-2%202H4a2%202%200%200%201-2-2V9a2%202%200%200%201%202-2h1.997a2%202%200%200%200%201.759-1.048l.489-.904A2%202%200%200%201%2010.004%204z%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2213%22%20r%3D%223%22%2F%3E%3C%2Fsvg%3E") center / contain no-repeat;
        animation: focus-wordmark 2.4s ease-in-out infinite;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      #root:empty::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 144px;
        height: 112px;
        color: #477b6d;
        background:
          linear-gradient(currentColor,currentColor) left top / 22px 2px,
          linear-gradient(currentColor,currentColor) left top / 2px 22px,
          linear-gradient(currentColor,currentColor) right top / 22px 2px,
          linear-gradient(currentColor,currentColor) right top / 2px 22px,
          linear-gradient(currentColor,currentColor) left bottom / 22px 2px,
          linear-gradient(currentColor,currentColor) left bottom / 2px 22px,
          linear-gradient(currentColor,currentColor) right bottom / 22px 2px,
          linear-gradient(currentColor,currentColor) right bottom / 2px 22px;
        background-repeat: no-repeat;
        transform: translate(-50%, -50%);
        animation: focus-frame 2.4s cubic-bezier(.4, 0, .2, 1) infinite;
      }
      
      #root:empty {
        display: flex;
        min-height: 100svh;
        align-items: center;
        justify-content: center;
        background: var(--bg-primary, #FAF8F4);
        position: relative;
      }
      
      @keyframes focus-wordmark {
        0%, 100% { opacity: .55; transform: translate(-50%, -50%) scale(.97); }
        40%, 65% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      }
      body { margin: 0; background: var(--bg-primary, #FAF8F4); }
      @keyframes focus-frame {
        0%, 100% { transform: translate(-50%, -50%) scale(1.08); opacity: .25; }
        40%, 65% { transform: translate(-50%, -50%) scale(.9); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #root:empty::before, #root:empty::after { animation: none; opacity: 1; }
        #root:empty::after { transform: translate(-50%, -50%); }
      }
      /* Keep the collection canvas/header surface steady until React mounts.
         No fake user controls or cached account markup in the startup shell. */
      html[data-startup-surface^="collections"] #root:empty::before { content: none; }
      html[data-startup-surface^="collections"] #root:empty::after { content: none; }

           </style>
