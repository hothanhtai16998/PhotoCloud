<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#FAF8F4" />
    <script id="site-theme-init">
      (() => {
        let dark = false;
        try { dark = localStorage.getItem('theme') === 'dark'; } catch {}
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.classList.toggle('dark-theme', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        // Public first paint must use the same surface as the eventual app.
        // Keep the admin startup path and palette runtime unchanged.
        if (/^\/admin(?:\/|$)/.test(location.pathname)) return;
        document.documentElement.dataset.publicStartup = '1';
        try {
          document.documentElement.dataset.publicLocale = localStorage.getItem('app_locale') === 'en' ? 'en' : 'vi';
          const chromeHint = sessionStorage.getItem('publicChromeHint');
          document.documentElement.dataset.publicChrome = ['member', 'manager', 'admin'].includes(chromeHint) ? chromeHint : 'guest';
        } catch {}
        const defaults = /* public-palette-defaults */ {};
        let cached;
        try { cached = JSON.parse(localStorage.getItem('photocloud.sitePalette.v1')); } catch {}
        const style = document.createElement('style');
        style.id = 'site-palette';
        style.textContent = ['light', 'dark'].map(theme => {
          const colors = Object.entries(defaults[theme]).map(([key, fallback]) => {
            const color = cached?.[theme]?.[key];
            return `${key}:${typeof color === 'string' && /^#[a-f\d]{6}$/i.test(color) ? color : fallback}`;
          }).join(';');
          const selector = theme === 'dark' ? 'html[data-site-palette].dark-theme' : 'html[data-site-palette]:not(.dark-theme)';
          return `${selector}{${colors}}${selector} body{${colors}}`;
        }).join('\n');
        document.head.append(style);
        document.documentElement.dataset.sitePalette = '1';
        const themeColor = cached?.[dark ? 'dark' : 'light']?.['--bg-primary'];
        document.querySelector('meta[name="theme-color"]').content =
          typeof themeColor === 'string' && /^#[a-f\d]{6}$/i.test(themeColor)
            ? themeColor : defaults[dark ? 'dark' : 'light']['--bg-primary'];
        if (location.pathname === '/') document.documentElement.dataset.homeLoading = 'pending';
        if (/^\/explore\/?$/.test(location.pathname)) document.documentElement.dataset.startupSurface = 'explore';
        if (/^\/packages\/?$/.test(location.pathname)) document.documentElement.dataset.startupSurface = 'packages';
        if (/^\/collections(?:\/|$)/.test(location.pathname)) {
          document.documentElement.dataset.startupSurface = location.pathname.replace(/\/$/, '') === '/collections' ? 'collections-list' : 'collections-detail';
        }
      })();
    </script>
    <!-- public-header-critical -->
    <script id="reload-scroll-reset">
      (() => {
        if (performance.getEntriesByType('navigation')[0]?.type !== 'reload') return;
        const previousRestoration = history.scrollRestoration;
        history.scrollRestoration = 'manual';
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
        window.addEventListener('pageshow', () => {
          requestAnimationFrame(() => {
            window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
            history.scrollRestoration = previousRestoration;
          });
        }, { once: true });
      })();
    </script>

    <style>
      /* CRITICAL: Hide scrollbar IMMEDIATELY on page load to prevent flash */
      /* Must be in <head> and load BEFORE any other CSS */
      /* This prevents scrollbar from appearing during page refresh */
      html[data-public-startup] {
        background-color: var(--bg-primary, #FAF8F4);
      }
      html {
        overflow-y: auto !important;
        overflow-x: hidden !important;
        scrollbar-gutter: stable !important;
        scrollbar-width: none !important; /* Firefox */
        -ms-overflow-style: none !important; /* IE and Edge */
        /* Declare header height BEFORE the CSS bundle loads so .app-body padding-top
           is correct immediately on refresh — prevents CLS from layout shift. */
        --header-height: 80px;
        --homepage-header-height: 80px;
        --header-height-mobile: 52px;
      }
      @media (max-width: 768px) {
        html {
          --header-height: 52px;
          --homepage-header-height: 52px;
        }
      }
      html::-webkit-scrollbar {
        display: none !important; /* Chrome, Safari, Opera */
        width: 0 !important;
        height: 0 !important;
      }
      body {
        overflow-y: visible !important;
        overflow-x: hidden !important;
      }
      /* Hide scrollbars on all elements to prevent any flash */
      * {
        scrollbar-width: none !important; /* Firefox */
        -ms-overflow-style: none !important; /* IE and Edge */
      }
      *::-webkit-scrollbar {
        display: none !important; /* Chrome, Safari, Opera */
        width: 0 !important;
        height: 0 !important;
      }
      
      body { margin: 0; background: var(--bg-primary, #FAF8F4); }
      #root:empty { min-height: 100svh; }
      #startup-loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--button-primary-bg, #795431); pointer-events: none; }
      html[data-home-loading] { overflow: hidden !important; }
      html[data-home-loading] :is(.PHOTOCLOUD-header,.public-header-startup,.contact-button,.mobile-bottom-nav,#root .homepage) { visibility: hidden; }
      html[data-home-loading] #startup-loading { display: grid !important; z-index: 2000; background: var(--bg-primary, #FAF8F4); }
      html[data-home-loading] .home-loading-error { visibility: visible; }
      #root:not(:empty) + #startup-loading,
      html[data-startup-surface="explore"] #startup-loading,
      html[data-startup-surface^="collections"] #startup-loading,
      html[data-startup-surface="packages"] #startup-loading { display: none; }
           </style>
