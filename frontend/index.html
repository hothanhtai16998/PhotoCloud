<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    />
    <meta
      name="description"
      content="PhotoApp - Discover and share beautiful high-quality photos. Browse thousands of free images, upload your own photos, and build your photography portfolio."
    />
    <meta
      name="keywords"
      content="photos, images, photography, free images, stock photos, photo sharing"
    />
    <meta name="theme-color" content="#667eea" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PhotoCloud" />
    <title>PhotoCloud</title>
    <!-- Performance: Preconnect only to most critical domains (reduced from 4+ to 2) -->
    <!-- Image CDN - critical for LCP -->
    <link rel="preconnect" href="https://cdn.uploadanh.cloud" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.uploadanh.cloud" />
    <!-- API domain - critical for initial data -->
    <link rel="preconnect" href="https://api.uploadanh.cloud" crossorigin />
    <link rel="dns-prefetch" href="https://api.uploadanh.cloud" />
    <style>
      /* CRITICAL: Hide scrollbar IMMEDIATELY on page load to prevent flash */
      /* Must be in <head> and load BEFORE any other CSS */
      /* This prevents scrollbar from appearing during page refresh */
      html {
        overflow-y: auto !important;
        overflow-x: hidden !important;
        scrollbar-gutter: stable !important;
        scrollbar-width: none !important; /* Firefox */
        -ms-overflow-style: none !important; /* IE and Edge */
      }
      html::-webkit-scrollbar {
        display: none !important; /* Chrome, Safari, Opera */
        width: 0 !important;
        height: 0 !important;
      }
      body {
        overflow-y: visible !important;
        overflow-x: hidden !important;
      }
      /* Hide scrollbars on all elements to prevent any flash */
      * {
        scrollbar-width: none !important; /* Firefox */
        -ms-overflow-style: none !important; /* IE and Edge */
      }
      *::-webkit-scrollbar {
        display: none !important; /* Chrome, Safari, Opera */
        width: 0 !important;
        height: 0 !important;
      }
      
      /* Initial loading spinner - shows before React loads */
      #root:empty::before {
        content: '';
        display: inline-block;
        width: 48px;
        height: 48px;
        border: 4px solid rgba(52, 152, 219, 0.2);
        border-top-color: #3498db;
        border-radius: 50%;
        animation: spinner-rotate 0.75s linear infinite;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      
      #root:empty {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        position: relative;
      }
      
             @keyframes spinner-rotate {
               0% {
                 transform: translate(-50%, -50%) rotate(0deg);
               }
               100% {
                 transform: translate(-50%, -50%) rotate(360deg);
               }
             }
             
             /* Refresh progress bar - shows immediately on beforeunload */
             body::before {
               content: '';
               position: fixed;
               top: 0;
               left: 0;
               width: 0%;
               height: 5px;
               background: linear-gradient(90deg, #667eea, #764ba2, #667eea);
               background-size: 200% 100%;
               z-index: 999999;
               opacity: 0;
               transition: width 0.3s ease, opacity 0.1s ease;
               pointer-events: none;
               box-shadow: 0 2px 8px rgba(102, 126, 234, 0.5);
             }
             
             body.refreshing::before {
               width: 100% !important;
               opacity: 1 !important;
               animation: refreshProgress 0.6s linear infinite;
               transition: none !important;
             }
             
             @keyframes refreshProgress {
               0% {
                 background-position: -200% 0%;
               }
               100% {
                 background-position: 200% 0%;
               }
             }
             
             /* Make sure body.refreshing is visible */
             body.refreshing {
               cursor: wait !important;
             }
           </style>
         </head>
         <body>
           <div id="root"></div>
           <script type="module" src="/src/main.tsx"></script>
           <script>
             // Immediate refresh handler - runs before React loads
             (function() {
               if (typeof window === 'undefined') return;
               
               let isRefreshing = false;
               
               // Catch F5/Ctrl+R early
               function handleKeyDown(e) {
                 var isRefreshKey = 
                   e.key === 'F5' || 
                   e.code === 'F5' ||
                   e.keyCode === 116 ||
                   (e.key === 'r' && (e.ctrlKey || e.metaKey)) ||
                   (e.key === 'R' && (e.ctrlKey || e.metaKey));
                 
                 if (isRefreshKey) {
                   console.log('[RefreshHandler] F5 detected in HTML!');
                   if (document.body) {
                     document.body.classList.add('refreshing');
                     // Force multiple repaints to ensure visibility
                     void document.body.offsetHeight;
                     requestAnimationFrame(function() {
                       void document.body.offsetHeight;
                     });
                   }
                 }
               }
               
               // Listen for keydown
               window.addEventListener('keydown', handleKeyDown, true);
               document.addEventListener('keydown', handleKeyDown, true);
               
               // Also catch beforeunload
               window.addEventListener('beforeunload', function(e) {
                 if (isRefreshing) return;
                 isRefreshing = true;
                 
                 console.log('[RefreshHandler] ⚡ Page refreshing - cancelling requests...');
                 
                 // Add refreshing class immediately
                 if (document.body) {
                   document.body.classList.add('refreshing');
                   // Force multiple repaints
                   void document.body.offsetHeight;
                   requestAnimationFrame(function() {
                     void document.body.offsetHeight;
                   });
                 }
                 
                 // Note: We can't prevent the refresh, but we can cancel requests
                 // The axios.ts handler will also cancel requests
               });
             })();
           </script>
         </body>
       </html>
