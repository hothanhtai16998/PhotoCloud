    <!-- Performance: Preconnect only to most critical domains (reduced from 4+ to 2) -->
    <!-- Image CDN - critical for LCP -->

    <link rel="dns-prefetch" href="https://cdn.uploadanh.cloud" />

    <style>
      /* CRITICAL: Hide scrollbar IMMEDIATELY on page load to prevent flash */
      /* Must be in <head> and load BEFORE any other CSS */
      /* This prevents scrollbar from appearing during page refresh */
      html {
        overflow-y: auto !important;
        overflow-x: hidden !important;
        scrollbar-gutter: stable !important;
        scrollbar-width: none !important; /* Firefox */
        -ms-overflow-style: none !important; /* IE and Edge */
      }
      html::-webkit-scrollbar {
        display: none !important; /* Chrome, Safari, Opera */
        width: 0 !important;
        height: 0 !important;
      }
      body {
        overflow-y: visible !important;
        overflow-x: hidden !important;
      }
      /* Hide scrollbars on all elements to prevent any flash */
      * {
        scrollbar-width: none !important; /* Firefox */
        -ms-overflow-style: none !important; /* IE and Edge */
      }
      *::-webkit-scrollbar {
        display: none !important; /* Chrome, Safari, Opera */
        width: 0 !important;
        height: 0 !important;
      }
      
      /* Initial loading spinner - shows before React loads */
      #root:empty::before {
        content: '';
        display: inline-block;
        width: 48px;
        height: 48px;
        border: 4px solid rgba(52, 152, 219, 0.2);
        border-top-color: #3498db;
        border-radius: 50%;
        animation: spinner-rotate 0.75s linear infinite;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      
      #root:empty {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        position: relative;
      }
      
             @keyframes spinner-rotate {
               0% {
                 transform: translate(-50%, -50%) rotate(0deg);
               }
               100% {
                 transform: translate(-50%, -50%) rotate(360deg);
               }
             }
           </style>
         </head>
         <body>
           <div id="root"></div>
          <script type="module" src="/src/main.tsx"></script>
          <!-- Request cancellation is handled by axios.ts, no inline script needed -->
         </body>
