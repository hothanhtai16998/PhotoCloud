<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    />
    <meta
      name="description"
      content="PhotoApp - Discover and share beautiful high-quality photos. Browse thousands of free images, upload your own photos, and build your photography portfolio."
    />
    <meta
      name="keywords"
      content="photos, images, photography, free images, stock photos, photo sharing"
    />
    <meta name="theme-color" content="#667eea" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PhotoCloud" />
    <title>PhotoCloud</title>
    <!-- Performance: Preconnect only to most critical domains (reduced from 4+ to 2) -->
    <!-- Image CDN - critical for LCP -->
    <link rel="preconnect" href="https://cdn.uploadanh.cloud" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.uploadanh.cloud" />
    <!-- API domain - critical for initial data -->
    <link rel="preconnect" href="https://api.uploadanh.cloud" crossorigin />
    <link rel="dns-prefetch" href="https://api.uploadanh.cloud" />
    <style>
      /* CRITICAL: Hide scrollbar IMMEDIATELY on page load to prevent flash */
      /* Must be in <head> and load BEFORE any other CSS */
      /* This prevents scrollbar from appearing during page refresh */
      html {
        overflow-y: auto !important;
        overflow-x: hidden !important;
        scrollbar-gutter: stable !important;
        scrollbar-width: none !important; /* Firefox */
        -ms-overflow-style: none !important; /* IE and Edge */
      }
      html::-webkit-scrollbar {
        display: none !important; /* Chrome, Safari, Opera */
        width: 0 !important;
        height: 0 !important;
      }
      body {
        overflow-y: visible !important;
        overflow-x: hidden !important;
      }
      /* Hide scrollbars on all elements to prevent any flash */
      * {
        scrollbar-width: none !important; /* Firefox */
        -ms-overflow-style: none !important; /* IE and Edge */
      }
      *::-webkit-scrollbar {
        display: none !important; /* Chrome, Safari, Opera */
        width: 0 !important;
        height: 0 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
