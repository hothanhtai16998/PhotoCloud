<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF8F4" />
      <stop offset="100%" stop-color="#F2EEE7" />
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B8865B" />
      <stop offset="100%" stop-color="#9A6F49" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)" />

  <!-- Camera lens group -->
  <g transform="translate(256, 256)">
    <circle r="180" fill="none" stroke="#B8865B" stroke-width="3" opacity="0.35" />
    <circle r="130" fill="none" stroke="#B8865B" stroke-width="3" opacity="0.55" />
    <circle r="80" fill="none" stroke="#B8865B" stroke-width="3" opacity="0.75" />
    <circle r="40" fill="#B8865B" opacity="0.18" />
    <circle r="18" fill="#1B1B19" />
  </g>

  <!-- Brand wordmark -->
  <text x="256" y="430" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="48" font-weight="500" fill="#1B1B19" letter-spacing="-1.2">PhotoCloud</text>
  <text x="256" y="465" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="3.5" fill="#8A6B2D">STUDIO</text>
</svg>
